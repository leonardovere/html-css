<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }
        
        div#a {
            /* 
                shorthand para definir configuração do filho
                flex = grow + shrink + basis

                - É o padrão
                flex: 0 1 auto; 
                flex: initial; 

                - Os elementos não são flexiveis
                flex: 0 0 auto;
                flex: none;

                - Os elementos são tototalmente flexiveis
                flex: 1 1 auto;
                flex: auto;

                - Definindo somente o grow
                flex: 3;
                flex: 3 1 auto;
            */
            flex: 1 0 200px;
        }
        
        div#b {
            /* flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 150px; */

            flex: 1 1 150px;
        }
        
        div#c {
            /* flex-grow: 1;
            flex-shrink: 8;
            flex-basis: auto; */
            flex: 1 8 auto;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
    </div>
</body>

</html>
